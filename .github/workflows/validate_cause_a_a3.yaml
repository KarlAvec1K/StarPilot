name: Validate Cause A A3

on:
  push:
    branches:
      - debug/cause-a-v2-ceoff-bypass
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-cause-a-a3
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout A3 branch
        uses: actions/checkout@v6
        with:
          ref: debug/cause-a-v2-ceoff-bypass
          fetch-depth: 1

      - name: Python syntax validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            selfdrive/controls/lib/longitudinal_planner.py \
            starpilot/controls/starpilot_planner.py \
            selfdrive/controls/tests/test_longitudinal_planner.py \
            selfdrive/controls/tests/test_starpilot_planner.py \
            tools/longitudinal/cause_a_regression.py

  hosted_predicates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout A3 branch
        uses: actions/checkout@v6
        with:
          ref: debug/cause-a-v2-ceoff-bypass
          fetch-depth: 1

      - name: Execute A3 predicates from source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import math
          from types import SimpleNamespace

          def load_function(path, name, extra_globals):
            tree = ast.parse(open(path, encoding="utf-8").read(), filename=path)
            node = next(n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == name)
            mod = ast.Module(body=[node], type_ignores=[])
            ast.fix_missing_locations(mod)
            ns = dict(extra_globals)
            exec(compile(mod, path, "exec"), ns)
            return ns[name]

          np_stub = SimpleNamespace(isfinite=math.isfinite)
          bypass = load_function(
            "selfdrive/controls/lib/longitudinal_planner.py",
            "should_bypass_model_throttle_gate",
            {"np": np_stub, "CE_OFF_THROTTLE_BYPASS_MIN_SPEED_GAP": 7.0 / 3.6},
          )

          base = dict(
            model_allow_throttle=False,
            explicit_disable_throttle=False,
            experimental_mode=False,
            conditional_experimental_mode=False,
            conditional_chill_mode=False,
            force_stops=False,
            force_slow_decel=False,
            brake_pressed=False,
            model_should_stop=False,
            forcing_stop=False,
            stop_sign_confirmed=False,
            tracking_lead=False,
            lead_present=False,
            v_cruise=22.0,
            v_ego=18.0,
          )
          assert bypass(**base)

          vetoes = (
            "explicit_disable_throttle",
            "experimental_mode",
            "conditional_experimental_mode",
            "conditional_chill_mode",
            "force_stops",
            "force_slow_decel",
            "brake_pressed",
            "model_should_stop",
            "forcing_stop",
            "stop_sign_confirmed",
            "tracking_lead",
            "lead_present",
          )
          for key in vetoes:
            case = dict(base)
            case[key] = True
            assert not bypass(**case), key

          # Stay off the exact floating-point boundary: validate a clear
          # value above and below the 7 km/h threshold.
          assert bypass(**dict(base, v_cruise=18.0 + 7.1 / 3.6))
          assert not bypass(**dict(base, v_cruise=18.0 + 6.9 / 3.6))
          assert not bypass(**dict(base, model_allow_throttle=True))

          redlight = load_function(
            "starpilot/controls/starpilot_planner.py",
            "is_red_light_control_active",
            {},
          )
          assert not redlight(SimpleNamespace(
            conditional_experimental_mode=False,
            conditional_model_stop_time=0.0,
            force_stops=False,
          ))
          assert not redlight(SimpleNamespace(
            conditional_experimental_mode=True,
            conditional_model_stop_time=0.0,
            force_stops=False,
          ))
          assert redlight(SimpleNamespace(
            conditional_experimental_mode=True,
            conditional_model_stop_time=7.7,
            force_stops=False,
          ))
          assert redlight(SimpleNamespace(
            conditional_experimental_mode=False,
            conditional_model_stop_time=0.0,
            force_stops=True,
          ))
          print("A3 source predicates: PASS")
          PY

  hosted_unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout A3 branch with submodules
        uses: actions/checkout@v6
        with:
          ref: debug/cause-a-v2-ceoff-bypass
          fetch-depth: 1
          submodules: recursive
          lfs: true

      - name: Install StarPilot test environment
        shell: bash
        run: |
          set -euo pipefail
          tools/op.sh setup

      - name: Build native host extensions
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate

          # A full host SCons pass currently reaches loggerd and fails on the
          # GitHub-hosted image because libx264 is absent. That dependency is
          # unrelated to the planner tests. Accept only that known host-env
          # failure, and require the native artifacts used by the tests.
          set +e
          scons -u -j"$(nproc)" 2>&1 | tee /tmp/a3-scons.log
          scons_rc=${PIPESTATUS[0]}
          set -e

          if [[ "${scons_rc}" -ne 0 ]]; then
            if ! grep -q "cannot find -lx264" /tmp/a3-scons.log; then
              echo "Unexpected SCons failure (rc=${scons_rc})" >&2
              exit "${scons_rc}"
            fi
            echo "Ignoring known GitHub-hosted libx264 linker limitation after required native targets build."
          fi

          test -f msgq_repo/msgq/ipc_pyx.so
          test -f common/params_pyx.so
          test -f selfdrive/controls/lib/longitudinal_mpc_lib/c_generated_code/acados_ocp_solver_pyx.so

      - name: Run targeted A3 pytest
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          pytest -q selfdrive/controls/tests/test_longitudinal_planner.py \
            -k "allow_throttle or no_throttle_cap or ce_off_positive_demand"
          pytest -q selfdrive/controls/tests/test_starpilot_planner.py \
            -k "red_light_control_flag"

  hosted_device_build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - name: Checkout A3 branch with submodules
        uses: actions/checkout@v6
        with:
          ref: debug/cause-a-v2-ceoff-bypass
          fetch-depth: 1
          submodules: recursive
          lfs: true

      - name: Show ARM runner resources
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          uname -m
          nproc
          free -h
          df -h /
          docker version
          docker buildx version

      - name: Build native ARM64 StarPilot builder image
        shell: bash
        run: |
          set -euo pipefail
          scripts/laptop_device_build.sh build-image

      - name: Extract TICI sysroot from AGNOS
        shell: bash
        run: |
          set -euo pipefail
          scripts/laptop_device_build.sh setup-sysroot-agnos
          scripts/laptop_device_build.sh doctor || true
          df -h /

      - name: Reclaim AGNOS image disk
        shell: bash
        run: |
          set -euo pipefail
          rm -f .cache/agnos/agnos_system.img.xz
          rm -f .cache/agnos/agnos_system.img
          rm -f .cache/agnos/agnos_system.ext4.img
          docker builder prune -f || true
          df -h /

      - name: Build complete StarPilot device target
        shell: bash
        run: |
          set -euo pipefail
          ./build 4

      - name: Verify device-target artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f prebuilt
          artifacts=(
            common/params_pyx.so
            msgq_repo/msgq/ipc_pyx.so
            selfdrive/controls/lib/longitudinal_mpc_lib/c_generated_code/acados_ocp_solver_pyx.so
            selfdrive/controls/lib/longitudinal_mpc_lib/c_generated_code/libacados_ocp_solver_long.so
            cereal/messaging/bridge
          )
          for artifact in "${artifacts[@]}"; do
            test -f "${artifact}"
            file "${artifact}"
            file "${artifact}" | grep -Eq 'ARM aarch64|aarch64'
          done
          echo "Hosted ARM64 device build: PASS"

  cause_a_unit:
    runs-on: [self-hosted, truenas, starpilot-build]
    timeout-minutes: 720
    steps:
      - name: Checkout A3 branch
        uses: actions/checkout@v6
        with:
          ref: debug/cause-a-v2-ceoff-bypass
          fetch-depth: 1
          submodules: recursive

      - name: Python syntax validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            selfdrive/controls/lib/longitudinal_planner.py \
            starpilot/controls/starpilot_planner.py \
            selfdrive/controls/tests/test_longitudinal_planner.py \
            selfdrive/controls/tests/test_starpilot_planner.py \
            tools/longitudinal/cause_a_regression.py

      - name: Longitudinal Cause A unit tests
        shell: bash
        run: |
          set -euo pipefail
          pytest -q selfdrive/controls/tests/test_longitudinal_planner.py \
            -k "allow_throttle or ce_off_positive_demand"

      - name: StarPilot red-light control unit test
        shell: bash
        run: |
          set -euo pipefail
          pytest -q selfdrive/controls/tests/test_starpilot_planner.py \
            -k "red_light_control_flag"

      - name: Regression harness help smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/longitudinal/cause_a_regression.py --help >/dev/null

      - name: Link persistent sysroot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .comma_sysroot
          ln -s /runner/sysroots/default .comma_sysroot
          test -d .comma_sysroot/usr

      - name: Build StarPilot device target
        shell: bash
        run: |
          set -euo pipefail
          export COMMA_HOST_ROOT_DIR="/mnt/Apparition/My_App_Data/starpilot-runner/_work/${GITHUB_REPOSITORY#*/}/${GITHUB_REPOSITORY#*/}"
          export COMMA_HOST_SYSROOT_DIR="/mnt/Apparition/My_App_Data/starpilot-runner/sysroots/default"
          export COMMA_HOST_CACHE_DIR="/mnt/Apparition/My_App_Data/starpilot-runner/cache/work"
          export COMMA_HOST_VENV_DIR="/mnt/Apparition/My_App_Data/starpilot-runner/cache/venv-linux-arm64"
          export COMMA_SYSROOT_DIR="/runner/sysroots/default"
          ./build 12
